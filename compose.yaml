services: #docker compose expects this
  backend:
    # image: python:3.13.4-slim-bullseye
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - 8080:8000
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - PORT=8000
    env_file:
      - .env
    volumes:
      - ./backend/src:/app
    depends_on:
      db_service:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: backend/requirements.txt
        - action: rebuild
          path: backend/Dockerfile
        - action: sync
          path: backend/src/
          target: /app
  db_service:
    image: postgres:17.5
    ports:
      - 5432:5432
    env_file:
      - .env
    volumes:
      - managed_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
